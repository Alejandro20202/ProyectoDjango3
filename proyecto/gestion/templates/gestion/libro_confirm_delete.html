<!DOCTYPE html>
<html>
<head>
    <title>Eliminar Libro</title>
</head>
<body>

    <h1>Eliminar Libro</h1>

    <p>¿Seguro que deseas eliminar el libro: <strong>{{ libro }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <a href="{% url 'lista_libros' %}">Cancelar</a>

</body>
</html>
